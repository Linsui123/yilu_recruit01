package Pro.login;

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial; padding: 20px; }
                .form-group { margin: 10px 0; }
        input { padding: 8px; width: 200px; }
        button { padding: 8px 20px; cursor: pointer; }
                .result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
                .success { color: green; }
                .error { color: red; }
    </style>
</head>
<body>
<h2>登录/注册</h2>
<div class="form-group">
    <input type="text" id="username" placeholder="用户名">
</div>
<div class="form-group">
    <input type="password" id="password" placeholder="登录密码">
</div>
<button onclick="login()">登录</button>

<div id="result" class="result" style="display:none;"></div>

<script>
    function login() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

        // 方式1：表单格式提交（application/x-www-form-urlencoded）
                const formData = new URLSearchParams();
        formData.append('name', username);
        formData.append('password', password);

        fetch('http://localhost:8080/login-demo/login', {
                method: 'POST',
                headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formData
                })
                .then(response => response.json())
                .then(data => {
                    const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        if (data.code === 200) {
            resultDiv.className = 'result success';
            resultDiv.innerHTML = '✓ ' + data.meg;
        } else {
            resultDiv.className = 'result error';
            resultDiv.innerHTML = '✗ ' + data.meg;
        }
                })
                .catch(error => {
                console.error('Error:', error);
                });
    }

    // 也支持URL拼接方式直接访问
    // http://localhost:8080/login-demo/login?username=test&password=123
</script>
</body>
</html>
